<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a365d"/>
      <stop offset="50%" stop-color="#285a82"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative subtle background elements -->
  <circle cx="150" cy="120" r="180" fill="#3b82f6" opacity="0.08"/>
  <circle cx="1050" cy="510" r="220" fill="#60a5fa" opacity="0.06"/>
  <path d="M 0 0 L 1200 630 M 1200 0 L 0 630" stroke="#ffffff" stroke-opacity="0.02" stroke-width="2"/>

  <!-- Main Content Centered -->
  <!-- App Icon Badge -->
  <g transform="translate(600, 160)">
    <circle cx="0" cy="0" r="64" fill="url(#badgeGrad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <!-- Bold Checkmark inside logo -->
    <path d="M -22 2 L -6 18 L 24 -14" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Headline: 123 ToDo -->
  <text x="600" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1px">
    123 ToDo
  </text>

  <!-- Subtitle: FREE Simple Task Management -->
  <text x="600" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#93c5fd" letter-spacing="0.5px">
    FREE Simple Task Management
  </text>

  <!-- Divider line -->
  <line x1="450" y1="410" x2="750" y2="410" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Features List -->
  <text x="600" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#e2e8f0" letter-spacing="0.2px">
    Priority-Based  •  Offline Support  •  Encrypted Google Drive Sync  •  Zero Tracking
  </text>
</svg>
