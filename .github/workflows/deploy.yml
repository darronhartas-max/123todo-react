name: Deploy to VPS

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build the application
        run: npm run build

      - name: Prep deploy package
        run: |
          cp Dockerfile build/
          cp -r nginx build/

      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "build/"
          target: "/home/debian/wordpress-docker/app-123todo/"
          strip_components: 1

      - name: Rebuild and restart Docker container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/debian/wordpress-docker
            cp app-123todo/Dockerfile Dockerfile.app
            docker compose build --no-cache app-123todo
            docker compose up -d app-123todo
            docker network connect traefik_proxy app-123todo || true
